<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="cache-control" content="max-age=0" />

	<title>創稿號</title>
</head>
<body>
	<div id="dlgPrintRefDoc" data-role="dialog" data-transition="slidedown"><!-- 1110627 Raymond 1110271 id變更dlgPrintFolio => dlgPrintRefDoc -->
		<h1 style="margin-top:-8px;margin-bottom:10px;">列印</h1>
		<div style="width:100%; height:376px; display:inline-block; float:left; margin-right:10px;">
			<div style="background-color:lightgray; height:320px; overflow-y:auto">
				<ul id="itemList" data-role="listview" data-theme="c" data-corners="false" data-mini="true" style="margin:0px;">
				</ul>
			</div>
			<div data-role="fieldcontain">
				<label for="chkPrintSignObjPages">列印簽核物件資訊頁</label>
				<input id="chkPrintSignObjPages" type="checkbox" data-theme="c">
				<label for="bothSide">雙面列印</label><!-- 1110627 Raymond 1110271 新增雙面列印選項 -->
				<input type="checkbox" id="bothSide" data-theme="c">
			</div>
		</div>
		<footer style="position:absolute; bottom:0px; width:100%; margin-left:-16px; clear:both;">
			<div style="width:49.5%;display:inline-block">
				<a id="cancel" data-role="button" data-corners="false" data-theme="c" style="color:#222;">取消</a>
			</div>
			<div style="width:49.5%;display:inline-block; position:absolute; right:0px">
				<a id="ok" data-role="button" data-corners="false" data-theme="b">確定</a>
			</div>
		</footer>
	</div>
