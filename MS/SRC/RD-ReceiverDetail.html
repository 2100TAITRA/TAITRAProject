<!DOCTYPE html>
<html>
<head>
	<!--meta name="viewport" content="width=640">
	<meta name="scale" content="1.0"-->
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>受文者明細子視窗</title>
</head>
<body>
<section id="receiverDetail" data-role="dialog">
    <header data-role="header">
        <h1 style="margin-top:-8px;margin-bottom:0px">受文者明細</h1>
    </header>
	<div data-role="content">
		<a data-role="none" class="modalCloseImg" title="關閉"></a>
		<div>受文者：<input id="fullName" style="width:200px" disabled>正副本稱謂：<input id="orgName" style="width:200px">姓名：<input id="userName" style="width:120px"></div>
		<div>本別：<select id="issueType">
			<option value="正本">正本</option>
			<option value="主持人">主持人</option>
			<option value="出席者">出席者</option>
			<option value="列席者">列席者</option>
			<option value="副本">副本</option>
			<option value="抄本">抄本</option>
		</select><div data-role="fieldcontain">
			<fieldset data-role="controlgroup" data-type="horizontal">
				<input id="incAtt-1" name="incAtt" type="radio" checked="false" data-theme="c"><label for="incAtt-1">含附件</label>
				<input id="incAtt-2" name="incAtt" type="radio" checked="false" data-theme="c"><label for="incAtt-2">不含附件</label>
			</fieldset>
		</div>發文方式：<select id="sendWay">
			<option value="電子交換" TYPE="非紙本">電子交換</option>
			<option value="郵寄" TYPE="紙本">郵寄</option>
			<option value="人工傳遞" TYPE="紙本">人工傳遞</option>
			<option value="電子郵件" TYPE="非紙本">電子郵件</option>
			<option value="內部電子公布欄" TYPE="非紙本">內部電子公布欄</option>
		</select></div>
		<div>地址：<input id="postNo" style="width:80px"><input id="addr" style="width:360px"></div>
		<div id="Redeemail_Info">EMail：<input id="email" style="150px"></div>
	</div>
	<footer data-role="footer">
		<div style="position:absolute;left:8px;bottom:12px;width:47%;display:inline-block">
			<a id="cancel" data-role="button" data-theme="c">取消</a>
		</div>
		<div style="position:absolute;left:50%;bottom:12px;width:47%;display:inline-block">
			<a id="ok" data-role="button" data-theme="b">確定</a>
		</div>
    </footer>
</section>
</body>
</html>
