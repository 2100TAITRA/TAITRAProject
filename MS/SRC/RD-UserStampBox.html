<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
</head>

<body>
    <div data-role="page" id="stampPage" data-theme="a">
        <header data-role="header">
            <h1>職名章選用</h1>
        </header>
        <div data-role="content">
            <div class="ui-grid-a">
                <div class="ui-block-a" id="stampList">
                    <label style="width: 135px"><input data-theme="c" type="checkbox" id="checkDispTime" checked="true"/>加蓋時戳</label><!-- 2015.6.22 預設勾選 -->
                    <ul data-role="listview" data-theme="c" data-inset="false" id="stampUl" style="margin: 0px;">
                        <!--章戳清單區塊-->
                    </ul>
                </div>
                <div class="ui-block-b" id="stampView" style="height: 310px;width: 35%; margin-left: 10%;">
                    <!--預覽顯示圖片區塊-->
                    <img style="display:none;width:350px;margin-top: 50px"></img>
                </div>
            </div>
        </div>
        <footer data-role="footer">
		<div style="position:absolute;left:8px;bottom:12px;width:47%;display:inline-block">
			<a id="cancel" data-role="button" data-theme="c">取消</a>
		</div>
		<div style="position:absolute;left:50%;bottom:12px;width:47%;display:inline-block">
			<a id="ok" data-role="button" data-theme="b">確定</a>
		</div>
        </footer>
    </div>
</body>



</html>
