<!DOCTYPE html>
<html>
<head>
	<!--meta name="viewport" content="width=device-width">
	<meta name="scale" content="1.0"-->
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>受文者設定頁面</title>
</head>
<body>
<section id="receiverList" data-role="page" style="overflow:hidden">
	<div class="ui-slide-pane-left ui-slide-pane-active" style="width:100%; height:100%">
		<header data-role="header" style="background-color: #333;">
			<h1 style="display:inline; margin:0; padding:0; font-size:2em;">受文者設定</h1>
			<div class="ui-btn-right">
				<div data-role="controlgroup" data-type="horizontal" style="display:inline-block; margin-top:0">
					<a data-role="button" data-theme="c" style="color:#222">排序</a>
					<select id="orderBy" data-theme="e">
						<option value="">無</option>
						<option value="受文者">受文者</option>
						<option value="正副本稱謂">正副本稱謂</option>
						<option value="姓名">姓名</option>
						<option value="本別">本別</option>
						<option value="含附件">含附件</option>
						<option value="發文方式">發文方式</option>
						<option value="郵遞區號">郵遞區號</option>
						<option value="地址">地址</option>
						<option value="EMail">EMail</option>
					</select>
				</div>
			</div>
		</header>
		<div class="content" data-role="content" data-theme="c">
			<div id="receiverTable" style="overflow-x: auto; border-width: 0px">
				<div class="ui-table-header" style="min-width: 824px">
					<div class="ui-table-column-header" style="width:30px">序</div>
					<div class="ui-table-column-header" style="width:210px;">受文者</div>
					<div class="ui-table-column-header" style="width:210px">正副本稱謂</div>
					<div class="ui-table-column-header" style="width:140px">姓名</div>
					<div class="ui-table-column-header" style="width:70px">本別</div>
					<div class="ui-table-column-header" style="width:90px">含附件</div>
					<br/><div style="display:inline-block; width:28px">&nbsp;</div>
					<div class="ui-table-column-header" style="width:110px">發文方式</div>
					<div class="ui-table-column-header" style="width:70px">郵遞區號</div>
					<div class="ui-table-column-header" style="width:320px">地址</div>
					<div class="ui-table-column-header" style="width:224px">EMail</div>
				</div>
				<div class="ui-table-body-container" style="height:398px; overflow-y:auto; min-width: 824px">
					<ul class="ui-table-body" id="receiverList"></ul>
				</div>
			</div>
		</div>
		<footer data-role="footer" style="position:absolute; width:100%; bottom:16px;">
			<div data-role="navbar">
				<ul>
					<li><a id="cancel" href="#" data-theme="c" data-icon="delete" style="color:#222">取消</a></li>
					<li><a id="ok" href="#" data-icon="check" data-theme="b">確定</a></li>
				</ul>
			</div>
		</footer>
	</div>
	<div id="searchDlgContainer" class="ui-slide-pane-right" style="width:100%; height:100%; position:absolute; left:0px; top:0px; z-index:1900;">
		<iframe></iframe>
		<a id="searchDlg_close_btn" style="display:none"></a>
	</div>
</section>
</body>
</html>
