<!DOCTYPE html>
<html>
<head>
	<!--meta name="viewport" content="width=640">
	<meta name="scale" content="1.0"-->
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>受文者批次設定子視窗</title>
</head>
<body>
<section id="receiverBatchSetting" data-role="dialog">
    <header data-role="header">
        <h1 style="margin-top:-8px;margin-bottom:0px">受文者批次設定</h1>
    </header>
	<div data-role="content">
		<div><label><input id="applyIssueType" type="checkbox">本別：</label><select id="issueType">
			<option value="正本">正本</option>
			<option value="副本">副本</option>
			<option value="抄本">抄本</option>
		</select></div>
		<label><input id="applyIncAtt" type="checkbox">含附件：</label><div data-role="fieldcontain">
			<fieldset data-role="controlgroup" data-type="horizontal">
				<input id="incAtt-1" name="incAtt" type="radio" checked="false" data-theme="c"><label for="incAtt-1">含附件</label>
				<input id="incAtt-2" name="incAtt" type="radio" checked="false" data-theme="c"><label for="incAtt-2">不含附件</label>
			</fieldset>
		</div>
		<div><label><input id="applySendWay" type="checkbox">發文方式：</label><select id="sendWay">
			<option value="電子交換">電子交換</option>
			<option value="郵寄">郵寄</option>
			<option value="人工傳遞">人工傳遞</option>
			<option value="電子郵件">電子郵件</option>
			<option value="內部電子公布欄">內部電子公布欄</option>
		</select></div>
	</div>
	<footer data-role="footer" style="margin-top:20px">
		<div style="width:47%;display:inline-block">
			<a id="cancel" data-role="button" data-theme="c">取消</a>
		</div>
		<div style="width:47%;display:inline-block">
			<a id="ok" data-role="button" data-theme="b">確定</a>
		</div>
    </footer>
</section>
</body>
</html>
