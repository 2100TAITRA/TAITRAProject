<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>敬陳設定子視窗</title>
</head>
<body>
	<div id="dlgStateSetting" data-role="dialog" data-transition="slidedown" style="overflow:hidden; width:calc(100% - 16px)">
		<style>
		.ui-btn-active
		{
			background: #fadb4e;
			text-shadow: 0 1px 0 #fff;
			border: none;
		}
		</style>
		<div class="ui-slide-pane-left ui-slide-pane-active">
			<h1 style="margin-top:2px;margin-bottom:10px;">敬陳設定子視窗</h1>
			<div style="width:100%; display:inline-block; float:left;">
				<label data-theme="b" data-corners="false" style="margin:0px; padding:.2em; background-color:#3366cc; color:white; font-size:14pt; text-align:center">敬陳者資訊編輯區</label>
				<div style="background-color:#ccffff; color:black;text-align:center">
					<div style="margin:0px; padding:6px .2em;text-align:center">
						<div for="State_wordlist" style="display:inline-block;background-color:Transparent;font-weight:600;">常用詞彙：</div>
						<select id="State_wordlist" data-theme="e" style="width:70%;display:inline-block;" data-inline="true" data-mini="true">
						</select>
					</div>
					<div for="State_Title" style="display:inline-block;background-color:Transparent;font-weight:600;">職稱：</div>
					<div style="width:20%;display:inline-block;">
						<input id="State_Title" data-inline="true">
					</div>
					<div for="State_name" style="display:inline-block;background-color:Transparent;font-weight:600;">姓名：</div>
					<div style="width:20%;display:inline-block;">
						<input id="State_name" data-inline="true">
					</div>
					<div style="display:inline-block;">
						<a id="State_addItem" data-role="button" data-mini="true" data-corners="false" data-theme="b" data-inline="true">加入</a>
					</div>
					<div>
						<a id="State_delItem" data-role="button" data-mini="true" data-corners="false" data-theme="b" data-inline="true">移除</a>
						<a id="State_moveUp" data-role="button" data-mini="true" data-corners="false" data-theme="b" data-inline="true">上移</a>
						<a id="State_moveDown" data-role="button" data-mini="true" data-corners="false" data-theme="b" data-inline="true">下移</a>
					</div>
					<div style="height:210px; overflow-y:scroll">
						<ul id="State_ItemList" data-role="listview"></ul>
					</div>
				</div>
			</div>
			<footer style="width:100%; clear:both;">
				<div style="width:49%;display:inline-block">
					<a id="State_close" data-role="button" data-corners="false" data-theme="c" style="color:#222;">離開</a>
				</div>
				<div style="width:49%;display:inline-block">
					<a id="State_Save" data-role="button" data-corners="false" data-theme="b">儲存</a>
				</div>
			</footer>
		</div>
	</div>
</body>
</html>
