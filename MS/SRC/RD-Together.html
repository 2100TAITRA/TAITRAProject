<!DOCTYPE html>
<html>
<head>
	<!--meta name="viewport" content="width=640">
	<meta name="scale" content="1.0"-->
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>新增文稿頁面</title>
</head>
<body>
<section id="together" data-role="page">
    <header data-role="header">
        <h1>會稿單位設定</h1>
    </header>
	<div data-role="content" data-theme="c">
		<div class="ui-field-contain">
			<fieldset data-role="controlgroup" data-type="horizontal" style="margin-left:20%">
				<legend>會辦方式：</legend>
				<label for="togetherMethod1">分會</label>
				<input type="radio" name="togetherMethod" id="togetherMethod1" checked>
				<label for="togetherMethod2">順會</label>
				<input type="radio" name="togetherMethod" id="togetherMethod2">
			</fieldset>
		</div>
		<div class="ui-block-a" style="width:40%; height:460px; overflow-y:auto">
			<ul data-role="listview" data-inset="true"></ul>
		</div>
		<div class="ui-block-b" style="width:59%; height:460px; overflow-y:auto">
			<ul data-role="listview" data-inset="true">
				<li>
					<a>
						<select>
							<option selected="true">敬會</option>
							<option>先會</option>
							<option>後會</option>
							<option>內會</option>
						</select>
						<span>人事室</span>
					</a>
					<a data-icon="delete">移除此單位</a>
				</li>
			</ul>
		</div>
	</div>
	<footer data-role="footer">
		<div data-role="navbar" class="ui-grid-a">
			<div class="ui-block-a">
				<a id="btnCancel" href="#" data-role="button" data-icon="delete" data-rel="back">取消</a>
			</div>
			<div class="ui-block-b">
				<a id="btnOk" href="#" data-role="button" data-icon="check" class="ui-btn-active" data-rel="back">確定</a>
			</div>
		</div>
    </footer>
</body>
</html>
