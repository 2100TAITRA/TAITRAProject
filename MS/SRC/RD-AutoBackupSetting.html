<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>自動備份設定</title>
</head>
<body>
	<div id="dlgAutoBackupSetting" data-role="dialog" data-transition="slidedown">
		<header data-theme="d">
			<h1 style="margin-top:0px">自動備份設定</h1>
		</header>
		<div data-role="content" data-theme="c">
			<label><input id="enableAutoBackup" type="checkbox" data-theme="c" data-inline="true">啟用自動備份</label>
			<div class="ui-field-contain">自動備份時間間隔：<input type="text" id="autoBackupPeriod" style="width: 80px" data-inline="true">分鐘</div>	<!-- 2016.12.30	Leslie	補上id -->
			<footer class="ui-grid-a">
				<div class="ui-block-a"><a id="cancel" data-role="button" data-corners="false" data-theme="c">取消</a></div>
				<div class="ui-block-b"><a id="ok" data-role="button" data-corners="false" data-theme="b">確定</a></div>       
			</footer>
		</div>
	</div>
</body>
</html>
