<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jQuery Resizable Columns Plugin Example</title>
  <link rel="stylesheet" href="dist/jquery.resizableColumns.css">
  <link rel="stylesheet" href="demo/demo.css">
</head>
<body>
  <div class="container" style="margin:150px auto">
    <div class="page-header">
    	<h1>
    		jQuery Resizable Columns Plugin Example
    	</h1>
      <p class="lead">An easy-to-use jQuery plugin that allows you to resize HTML table columns by mouse dragging.</p>
	</div>

    <blockquote><em>Grab the column borders and drag 'em! <strong>Bonus: refresh the page.</strong></em></blockquote>

    <table class="table table-bordered table-striped" data-resizable-columns-id="demo-table-v2">
      <thead>
        <tr>
          <th data-resizable-column-id="#">#</th>
          <th data-resizable-column-id="first_name">First Name</th>
          <th data-resizable-column-id="last_name">Last Name</th>
          <th data-resizable-column-id="username" id="username-column" data-noresize>Username</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Mark</td>
          <td>Otto</td>
          <td>@mdo</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Jacob</td>
          <td>Thornton</td>
          <td>@fat</td>
        </tr>
        <tr>
          <td>3</td>
          <td colspan="2">Larry the Bird</td>
          <td>@twitter</td>
        </tr>
      </tbody>
    </table>


  </div>

  <!-- jQuery -->
  <script src="../Lib/jquery.js"></script>

  <!-- Optional localStorage dependancy, for persistent column width storage -->
  <!--script src="http://cdnjs.cloudflare.com/ajax/libs/store.js/1.3.14/store.min.js"></script-->

  <!-- Plugin -->
  <script src="dist/jquery.resizableColumns.js"></script>
  <!--script>
    $(function(){
     $("table").resizableColumns({
      store: window.store
      });
    });
  </script-->
</body>
</html>
