<!DOCTYPE html>
<html>
<head>
	<!--meta name="viewport" content="width=640">
	<meta name="scale" content="1.0"-->
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>群組受文者明細子視窗</title>
</head>
<body>
<section id="receiverDetail" data-role="dialog">
    <header data-role="header">
        <h1 style="margin-top:-8px;margin-bottom:0px">群組受文者明細</h1>
    </header>
	<div data-role="content">
		<div class="ui-li-header">群組名稱：<input id="grpName" style="width:180px">本別：<select id="issueType">
				<option value="正本">正本</option>
				<option value="主持人">主持人</option>
				<option value="出席者">出席者</option>
				<option value="列席者">列席者</option>
				<option value="副本">副本</option>
				<option value="抄本">抄本</option>
			</select>
			<a data-role="none" class="modalCloseImg" title="關閉"></a>
		</div>
		<div class="ui-li-command-bar">
			<div>
				<input type="button" id="selectAll" value="全選">
				<input type="button" id="unselectAll" value="全不選">
				<input type="button" id="deleteItem" value="刪除">
				<input type="button" id="batchSetting" value="批次設定">
			</div>
		</div>
		<ul style="list-style-type:none; padding:0; margin:0; max-height:360px; overflow-y:scroll">
			<li>
				<div><label><input id="selected" type="checkbox">&nbsp;</label>受文者：<input id="fullName" style="width:160px">正副本稱謂：<input id="orgName" style="width:160px">姓名：<input id="userName" style="width:120px"><div data-role="fieldcontain">
					<fieldset data-role="controlgroup" data-type="horizontal">
						<input id="incAtt-1" name="incAtt" type="radio" checked="false" data-theme="c"><label for="incAtt-1">含附件</label>
						<input id="incAtt-2" name="incAtt" type="radio" checked="false" data-theme="c"><label for="incAtt-2">不含附件</label>
					</fieldset>
				</div></div>
				<div style="padding-left:40px">發文方式：<select id="sendWay">
					<option value="電子交換">電子交換</option>
					<option value="郵寄">郵寄</option>
					<option value="人工傳遞">人工傳遞</option>
					<option value="電子郵件">電子郵件</option>
					<option value="內部電子公布欄">內部電子公布欄</option>
				</select>地址：<input id="postNo" style="width:80px"><input id="addr" style="width:260px">EMail：<input id="email" style="150px"></div>
			</li>
		</ul>
	</div>
	<footer data-role="footer">
		<div style="position:absolute;left:8px;bottom:12px;width:47%;display:inline-block">
			<a id="cancel" data-role="button" data-theme="c">取消</a>
		</div>
		<div style="position:absolute;left:50%;bottom:12px;width:47%;display:inline-block">
			<a id="ok" data-role="button" data-theme="b">確定</a>
		</div>
    </footer>
</section>
</body>
</html>
