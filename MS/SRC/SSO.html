<body>
  <span id="httpObject" style="display:none"></span>
  <div data-role="page" id="home" data-theme="b"></div>
  <div id="login" class="login_slidedown">
	  <div class="main" data-role="content" id="mainContent">
		  <div class="upper-part"></div>
		  <div class="middle-part ui-grid-b">
		  	  <!-- 20210929	Leslie[1100944]	Merge首頁機關客製化Logo區域 -->
		  	  <div id="OrgTitle" class="ui-block-b ImgTitle"></div>
			  <!--20170321 Kevin 新增首頁圖示-->
			  <div id="LoginTitle"></div>
			  <div class="input_panel ui-block-b ui-page-theme-e" id="LoginMain">
				  <div id="orgid_wrapper" class="selector_wrapper ui-field-contain" data-type="horizontal" data-theme="e">
					<input id="orgid_input" type="text" size='10' readonly='readonly' data-theme="e" />
					<span class="ui-icon-arrow-d" style="pointer-events:none"></span>
				  </div>
				  <div class="ui-field-contain" data-mini="true">
					<fieldset data-role="controlgroup" data-type="horizontal" data-mini="true" style="margin-left:5%">
					  <input type="radio" name="radio-choice-login-type" id="radio-choice-loginbyAccount" value="login-choice-account" checked="checked" />
					  <label for="radio-choice-loginbyAccount">帳號密碼</label>
					  <input type="radio" name="radio-choice-login-type" id="radio-choice-loginbyCert" value="login-choice-cert"  />
					  <label for="radio-choice-loginbyCert">智慧卡</label>
					  <input type="radio" name="radio-choice-login-type" id="radio-choice-loginbyMobileMoica" value="login-choice-moica"  />
					  <label for="radio-choice-loginbyMobileMoica">行動自然人憑證</label>
					  <a href="RD-DlgResetPassword.html?ver=5.0.105.04801"  data-rel="dialog" data-transition="slidedown"  id="lkResetPWD">忘記密碼</a>
					  <a href="#" style="display:none" id="lkQRCode">QRCode驗證</a>
					</fieldset>
				  </div>
				  <div class="userid_wrapper ui-field-contain" data-type="horizontal">
					  <label for="userid">帳　號：</label>
					  <input id="in_userid" name="userid" type='text' value="" autocomplete="off" />
				  </div>
				  <div class="password_wrapper ui-field-contain" data-type="horizontal">
					  <label for="password">密　碼：</label>
					  <input id="in_password" name="password" type='password' autocomplete="off" />
				  </div>
				  <!-- 20220307	Leslie[1101521]	新增圖型驗證功能 -->
				  <div class="password_wrapper ui-field-contain" id="verifyCodeContain" data-type="horizontal">
					  <label for="verifyCode">驗證碼：</label>
					  <input id="in_verifyCode" name="verifyCode" type='text' autocomplete="off" maxlength="5" />
					  <img src=""/>
					  <a href=""  data-rel="dialog" id="lkVerifyCode">重取</a>
				  </div>
				  <div><!--class="ui-grid-a"-->
					  <!--div class="ui-block-a"></div-->
					  <div>
						  <input type="submit" value="登　　入" id="btn_login" data-theme="b" />
					  </div>
				  </div>
				  <div id="gotoOfflineLoginPage" style="display:none"><!-- 1130808 Raymond 1130313 合併1111007(1100394), 新增切換至離線版登入頁面 -->
					  <a href="SSO_Offline.html" data-role="button" data-theme="a" data-rel="external" target="_self">離線版公文製作</a>
				  </div>
			  </div>
		  </div>
		  <div class="bottom_part"></div>
	  </div>
  </div> <!--div data-role="page" id="login" ... -->

		</div>
