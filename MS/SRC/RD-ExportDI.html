<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>另存DI檔</title>
</head>
<body>
	<div id="dlgExportDI" data-role="dialog" data-transition="slidedown">
		<header data-theme="d">
			<h1 style="margin-top:0px">另存DI檔</h1>
		</header>
		<div data-role="content" data-theme="c">
			<div style="background-color:lightgray; color:black; height:280px">
				<div class="ui-field-contain"><legend>版本：</legend>
					<label for="di99">99年版</label>
					<input type="radio" name="diVer" id="di99" data-theme="c" checked>
					<label for="di104">104年版</label>
					<input type="radio" name="diVer" id="di104" data-theme="c">
					<label for="genDM">產生文書訊息表單檔</label>
					<input id="genDM" type="checkbox" data-theme="c" data-mini="true" style="vertical-align:initial">
				</div>
				<div data-role="fieldcontain">
					<label for="dmCode" style="width:auto">文書訊息代碼：</label>
					<select id="dmCode">
						<option value="　">　</option>
						<option value="文書本文修正重發">文書本文修正重發</option>
						<option value="本文附件修正重發">本文附件修正重發</option>
						<option value="附件修正重發">附件修正重發</option>
						<option value="錯發">錯發</option>
						<option value="測試">測試</option>
						<option value="本文附件未修正重發">本文附件未修正重發</option><!-- 1101019 Raymond 1100342 配合109法規新增文書訊息代碼「6」-"本文附件未修正重發" -->
					</select>
				</div>
				<div data-role="fieldcontain">
					<label for="dmComment">訊息備註：</label>
					<textarea id="dmComment" data-role="none" style="width:72%; height:100px"></textarea><!-- 1100326 Raymond 1090927 fix for iOS Safari 文字方塊會折行問題 -->
				</div>
			</div>
		</div>
		<footer class="ui-grid-a">
			<div class="ui-block-a"><a id="cancel" data-role="button" data-corners="false" data-theme="c">取消</a></div>
			<div class="ui-block-b"><a id="ok" data-role="button" data-corners="false" data-theme="b">確定</a></div>       
		</footer>
	</div>
</body>
</html>
