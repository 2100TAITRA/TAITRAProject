<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>批次時間設定</title>
</head>
<body>
	<div id="dlgConUnitSetting" data-role="dialog" data-transition="slidedown" style="overflow:hidden; width:calc(100% - 16px)">
		<style>
			.ui-state-highlight
			{
				border: 1px solid #fed22f;
				background: #ffe45c url("images/ui-bg_highlight-soft_75_ffe45c_1x100.png") 50% top repeat-x;
				color: #363636;
			}
			.ui-state-hover
			{
				border: 1px solid #fbcb09;
				background: #fdf5ce url("images/ui-bg_glass_100_fdf5ce_1x400.png") 50% 50% repeat-x;
				font-weight: bold;
				color: #c77405;
			}
			.ui-btn-active
			{
				background: #fadb4e;
				text-shadow: 0 1px 0 #fff;
				border: none;
			}
		</style>
		<div class="ui-slide-pane-left ui-slide-pane-active">
			<h1 style="margin-top:2px;margin-bottom:10px;">批次時間設定</h1>
			<div style="width:100%; display:inline-block; float:left;">
				<label data-theme="b" data-corners="false" style="margin:0px; padding:.2em; background-color:#3366cc; color:white; font-size:14pt; text-align:center">批次時間編輯區</label>
				<div style="background-color:#ccffff; color:black;text-align:center">
					<div style="width:100%;">
						<div style="width:30%;display:inline-block;">
							<input id="Tomeet_DateItem" type="text" maxlength="10" value="點擊顯示小日曆">
						</div>
						<!--div for="DIVTomeet_WeekItem" style="display:inline-block;background-color:Transparent;font-weight:600;">點擊顯示日曆</div-->
						<!--div class="ui-input-text ui-body-inherit ui-corner-all" style="border: currentColor; border-image: none; width: 8em; font-weight: 600; display: inline-block; cursor: pointer; background-color: transparent;"><input type="text" maxlength="10" value=""></div-->
						<div for="DIVTomeet_WeekItem" style="display:inline-block;background-color:Transparent;font-weight:600;">星期：</div>
					<div style="width:8%;display:inline-block;">
						<input id="Tomeet_WeekItem" data-inline="true" maxlength="1">
					</div>
					</div>
					
					<div for="DIVTomeet_TimeItem" style="display:inline-block;background-color:Transparent;font-weight:600;">時：</div>
					<div style="width:12%;display:inline-block;">
						<input id="Tomeet_TimeHHItem" data-inline="true" maxlength="2">
					</div>
					<div for="DIVTomeet_TimeItem" style="display:inline-block;background-color:Transparent;font-weight:600;">分：</div>
					<div style="width:12%;display:inline-block;">
						<input id="Tomeet_TimeMMItem" data-inline="true" maxlength="2">
					</div>
					<div style="display:inline-block;">
						<a id="Tomeet_addItem" data-role="button" data-mini="true" data-corners="false" data-theme="b" data-inline="true">加入</a>
					</div>
					<div>
						<a id="Tomeet_delItem" data-role="button" data-mini="true" data-corners="false" data-theme="b" data-inline="true">移除</a>
						<a id="Tomeet_moveUp" data-role="button" data-mini="true" data-corners="false" data-theme="b" data-inline="true">上移</a>
						<a id="Tomeet_moveDown" data-role="button" data-mini="true" data-corners="false" data-theme="b" data-inline="true">下移</a>
					</div>
					<div style="height:220px; overflow-y:scroll">
						<ul id="Tomeet_ItemList" data-role="listview"></ul>
					</div>
				</div>
			</div>
			<footer style="width:100%; clear:both;">
				<div style="width:49%;display:inline-block">
					<a id="Tomeet_Close" data-role="button" data-corners="false" data-theme="c" style="color:#222;">離開</a>
				</div>
				<div style="width:49%;display:inline-block">
					<a id="Tomeet_Save" data-role="button" data-corners="false" data-theme="b">儲存</a>
				</div>
			</footer>
		</div>
		<div class="ui-slide-pane-right" style="width:100%">
			<iframe style="width:100%; height:422px;"></iframe>
			<a id="extdlg_close_btn" style="display:none"></a>
		</div>
	</div>
</body>
</html>
