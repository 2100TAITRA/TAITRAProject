<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
    <title>SSO-PincodeDialog</title>
</head>
<body>
    <div id="dlgPincode" data-role="dialog" data-transition="slidedown" data-changeHash="false" data-history="false">
      <div data-role="header" data-theme="d">
        <h1>輸入金鑰密碼</h1>
      </div>
      <div data-role="content" data-theme="c">
        <div class="prompt">請輸入簽章用軟體憑證的金鑰密碼：</div>
        <input id="pincodeText" type="password" placeholder="金鑰密碼"></input>
        <label><input id="useTmpCert" type="checkbox" />使用(軟體)臨時憑證</label> <!-- 2017.1.24 - 使用軟體臨時憑證 -->
		<label id="lbMobileMoica"><input id="useMobileMoica" type="checkbox"  />使用行動自然人憑證</label> <!-- 2023.5.16 - [1111006][Merge]新增行動自然人相關功能 -->
		<select id="apiMode" data-mini="true">
			<option value="PUSH">推播</option>
			<option value="WebToAPP">WebToAPP</option>
			<option value="QRCode">QRCode</option>
		</select>
        <span id="iOSPrompt" style="display:none"></span>
        <div class="ui-grid-a">
          <div class="ui-block-a"><a href="#home" id="OKBtn" data-role="button" data-theme="b">確定</a></div>       
          <div class="ui-block-b"><a href="#home" id="CancelBtn" data-role="button" data-theme="c">取消</a></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
