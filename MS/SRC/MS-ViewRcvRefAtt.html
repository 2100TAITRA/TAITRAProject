<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>來文參考檔案檢視</title>
</head>
<body>
	<div id="dlgViewRef" data-role="dialog" data-transition="slidedown">
		<header>
			<h2 style="margin-top:-8px;margin-bottom:10px;">來文參考檔案檢視</h2>
		</header>
		<div data-role="content" data-theme="b"  style="background-color:lightgray; width:708px; height:360px;">
			<a id="dl" data-role="button" data-theme="b" data-inline="true" style="float:right;">下載</a>
			<div style="width:100%; clear:both;">
				<div id="refAttTable">
					<div class="ui-table-header">
						<div class="ui-table-column-header" style="width:30px">序</div>
						<div class="ui-table-column-header" style="width:200px">名稱</div>
						<div class="ui-table-column-header" style="width:200px">說明</div>
						<div class="ui-table-column-header" style="width:90px">人員</div>
						<div class="ui-table-column-header" style="width:150px">加入時間</div>
					</div>
					<div class="ui-table-body-container" style="height:200px; overflow-y:auto">
						<ol data-role="listview" class="ui-table-body" id="RcvRefAttList" style="margin:0px;"></ol>
					</div>
				</div>
			</div>
		</div>
		<div data-role="navbar">
			<ul>
				<li><button id="btnClose" data-icon="delete" data-iconpos="top" data-theme="c" data-transition="slide" data-corners="false">關閉</button></li>
			</ul>
		</div>
	</div>
</body>
</html>
