<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>多稿轉出</title>
</head>
<body>
	<div id="dlgGenMailMerges" data-role="dialog" data-transition="slidedown">
		<header>
			<h1 style="margin-top:-8px;margin-bottom:10px;">多稿轉出</h1>
		</header>
		<div class="content" data-role="content" style="background-color:lightgray; min-width:803px"><!-- 1100326 Raymond 1090927 fix for iOS Safari 修正小螢幕時第一排功能按鈕會折行問題, 新增min-width:803px -->
			<label style="display:inline-block;" data-mini="true"><input data-theme="c" type="checkbox" id="incCopy" checked="true" data-mini="true"/>轉出包含副本受文者</label>
			<a id="default" data-role="button" data-corners="false" data-theme="c" data-inline="true">設定預設值</a>
			<a id="importCSV" data-role="button" data-corners="false" data-theme="c" data-inline="true">匯入CSV檔</a>
			<a id="exportCSV" data-role="button" data-corners="false" data-theme="c" data-inline="true">匯出CSV檔</a>
			<a id="save" data-role="button" data-corners="false" data-theme="b" data-inline="true">儲存</a>
			<a id="ok" data-role="button" data-corners="false" data-theme="c" data-inline="true">轉出</a>
			<a id="cancel" data-role="button" data-corners="false" data-theme="c" data-inline="true">取消</a>
			<div style="width:100%; height:410px;">
				<div id="mailMergeTable" style="overflow-x:scroll">
					<div class="ui-table-header">
						<div class="ui-table-column-header" style="width:30px">序</div><div class="ui-table-column-header" style="width:200px">受文者</div><div class="ui-table-column-header" style="width:60px">本別</div>
					</div>
					<div class="ui-table-body-container" style="height:354px; overflow:auto;">
						<ul class="ui-table-body" id="mailMergeList"></ul>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
