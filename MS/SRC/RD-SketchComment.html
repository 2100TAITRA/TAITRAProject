<html>
<head>

	<title>數位墨水意見</title>
</head>
<body>
<section id="sketchComment" data-role="dialog">
    <header data-role="header">
        <h1 style="margin-top:0px;margin-bottom:.5em">新增數位墨水意見</h1>
    </header>
	<div data-role="content" style="width:97%">
        <div style="height:270px;">
            <canvas width="450px" height="270px" style="background:white;cursor:crosshair;float:left;margin-bottom:-10px"></canvas>
            <ul id="penSelector" data-role="listview" data-theme="c" style="width:20%;float:right">
                <li class="ui-btn-active">鋼筆</li>
                <li>紅筆</li>
                <li>螢光筆</li>
                <li>橡皮擦</li>
            </ul>
        </div>
    </div>
	</div>
	<footer data-role="footer">
		<div style="position:absolute;left:8px;bottom:0px;width:47%;display:inline-block">
			<a id="cancel" data-role="button" data-theme="c">取消</a>
		</div>
		<div style="position:absolute;left:50%;bottom:0px;width:47%;display:inline-block">
			<a id="ok" data-role="button" data-theme="b">確定</a>
		</div>
    </footer>
</section>
</body>
