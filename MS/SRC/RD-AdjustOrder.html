<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>創稿號</title>
</head>
<body>
	<div id="dlgAdjustOrder" data-role="dialog" data-transition="slidedown">
		<header>
			<h1 style="margin-top:-8px;margin-bottom:10px;">自訂文稿順序</h1>
		</header>
		<div data-role="content" style="background-color:lightgray;">
			<!--a id="btnByType" data-role="button" data-inline="true">依類型排序</a-->
			<!--a id="btnByTime" data-role="button" data-inline="true">依時間排序</a-->
			<a id="btnRestore" data-role="button" data-inline="true">回復</a>
			<div style="width:100%; height:300px; overflow-y:auto;">
				<ol id="draftList" data-role="listview" data-theme="c" style="margin:0px">
				</ol>
			</div>
		</div>
		<footer style="position:absolute; bottom:0px; width:calc(100% - 16px);">
			<div style="width:49%; display:inline-block">
				<a id="cancel" data-role="button" data-corners="false" data-theme="c" style="margin:0">取消</a>
			</div>
			<div style="width:49%; display:inline-block; position:absolute; right:0px;">
				<a id="ok" data-role="button" data-corners="false" data-theme="b" class="ui-disabled" style="margin:0">確定</a>
			</div>
		</footer>
	</div>
</body>
</html>
