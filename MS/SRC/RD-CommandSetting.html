<!DOCTYPE html>
<html>
<head>
	<!--meta name="viewport" content="width=640">
	<meta name="scale" content="1.0"-->
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>簽核工具列設定頁面</title>
</head>
<body>
<section id="commandSettingDlg" data-role="dialog">
    <header data-role="header">
        <h1>簽核工具列設定</h1>
    </header>
	<div class="ui-grid-a" id="commandSetting" data-role="content" data-theme="c">
		<div class="ui-block-a" style="background-color:lightgray;color:black;">
			<div style="font-size:14pt;text-align:center;">簽核區域內工具列</div>
			<div>
				<button id="selAll-in" data-inline="true">全選</button>
				<button id="unselAll-in" data-inline="true">取消</button>
				<button id="revert-in" data-inline="true">反向</button>
			</div>
			<table style="width: 100%;padding-bottom: 2mm;">
				<thead style="background-color: lightblue;">
					<tr>
						<th>序</th>
						<th>啟用</th>
						<th>工具名稱</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td>1</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="9" checked></td>
						<td>文字意見</td>
					</tr>
					<tr>
						<td>2</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="10" checked></td>
						<td>職名章</td>
					</tr>
					<tr>
						<td>3</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="11" checked></td>
						<td>章戳選用</td>
					</tr>
					<tr>
						<td>4</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="1"></td>
						<td>鋼筆簽核意見</td>
					</tr>
					<tr>
						<td>5</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="2"></td>
						<td>紅筆</td>
					</tr>
					<tr>
						<td>6</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="3"></td>
						<td>螢光筆</td>
					</tr>
					<tr>
						<td>7</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="4"></td>
						<td>螢光筆(直線)</td>
					</tr>
					<tr>
						<td>8</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="5"></td>
						<td>插入文字於上</td>
					</tr>
					<tr>
						<td>9</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="6"></td>
						<td>插入文字於下</td>
					</tr>
					<tr>
						<td>10</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="7"></td>
						<td>刪劃文字</td>
					</tr>
					<tr>
						<td>11</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="8"></td>
						<td>復原刪除記號</td>
					</tr>
					<tr>
						<td>12</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="12"></td>
						<td>貼布</td>
					</tr>
				</tbody>
			</table>
		</div>
		<div class="ui-block-b" style="background-color:lightgray;color:black;">
			<div style="font-size:14pt;text-align:center;">簽核區域外工具列</div>
			<div>
				<button id="selAll-out" data-inline="true">全選</button>
				<button id="unselAll-out" data-inline="true">取消</button>
				<button id="revert-out" data-inline="true">反向</button>
			</div>
			<table style="width: 100%;padding-bottom: 2mm;">
				<thead style="background-color: lightblue;">
					<tr>
						<th>序</th>
						<th>啟用</th>
						<th>工具名稱</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td>1</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="9" checked></td>
						<td>文字意見</td>
					</tr>
					<tr>
						<td>2</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="10"></td>
						<td>職名章</td>
					</tr>
					<tr>
						<td>3</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="11"></td>
						<td>章戳選用</td>
					</tr>
					<tr>
						<td>4</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="1"></td>
						<td>鋼筆簽核意見</td>
					</tr>
					<tr>
						<td>5</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="2" checked></td>
						<td>紅筆</td>
					</tr>
					<tr>
						<td>6</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="3" checked></td>
						<td>螢光筆</td>
					</tr>
					<tr>
						<td>7</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="4" checked></td>
						<td>螢光筆(直線)</td>
					</tr>
					<tr>
						<td>8</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="5" checked></td>
						<td>插入文字於上</td>
					</tr>
					<tr>
						<td>9</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="6" checked></td>
						<td>插入文字於下</td>
					</tr>
					<tr>
						<td>10</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="7" checked></td>
						<td>刪劃文字</td>
					</tr>
					<tr>
						<td>11</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="8"></td>
						<td>復原刪除記號</td>
					</tr>
					<tr>
						<td>12</td>
						<td style="align-content:baseline"><input type="checkbox" data-cmd-id="12"></td>
						<td>貼布</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
	<footer data-role="footer">
		<div style="width:49.5%;display:inline-block">
			<a id="cancel" data-role="button" data-theme="c" data-corners="false">取消</a>
		</div>
		<div style="width:49.5%;display:inline-block">
			<a id="ok" data-role="button" data-theme="b" data-corners="false">確定</a>
		</div>
    </footer>
</section>
</body>
</html>
