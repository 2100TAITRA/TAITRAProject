<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
</head>

<body>
    <div data-role="page" id="stampPage" data-theme="a">
        <header data-role="header">
            <h1 style="margin-top:0px">章戳選用</h1>
        </header>
        <div data-role="content">
			<table>
				<tr>
				<td width="143px">
					<input id="withStamp" type="checkbox" data-theme="c"/>
					<label for="withStamp">加蓋職名章</label>
				</td>
				<td width="180px">
					<select data-theme="c" id="signet"></select>
				</td>
				<td width="126px">
					<input id="addProxyWord" type="checkbox" data-theme="c"/>
					<label for="addProxyWord">加蓋代字</label>
				</td>
				<td width="126px">
					<input id="dispTime" type="checkbox" data-theme="c"/>
					<label for="dispTime">加蓋時戳</label>
				</td>
				<td width="180px">
					<select data-theme="c" id="alignMode">
						<option value="0" selected>右邊界對齊行尾</option>
						<option value="1">左邊界對齊行尾</option>
						<option value="2">左邊界對齊行首</option>
						<option value="3">置中對齊(職名章在下)</option>
						<option value="4">置中對齊(職名章在上)</option>
					</select>
				</td>
				<td width="126px">
					<input id="grantAppr" type="checkbox" data-theme="c"/>
					<label for="grantAppr">代為決行</label>
				</td>
				</tr>
			</table>
            <div class="ui-grid-a">
                <div class="ui-block-a" id="stampList">
                    <!--label style="width: 135px"><input data-theme="c" type="checkbox" id="checkDispTime"/>加蓋時戳</label-->
					<div style="height:270px; overflow:auto; -webkit-overflow-scrolling:touch">
						<div data-role="collapsible-set" data-theme="c" data-content-theme="d" id="stampSet" data-corners="false" style="margin:0px">
							<!--div data-role="collapsible">
								<h3>Section 1</h3>
								<p>I'm the collapsible content for section 1</p>
							</div>
							<div data-role="collapsible">
								<h3>Section 2</h3>
								<p>I'm the collapsible content for section 2</p>
							</div>
							<div data-role="collapsible">
								<h3>Section 3</h3>
								<p>I'm the collapsible content for section 3</p>
							</div-->
						</div>
					</div>
                    <!--ul data-role="listview" data-theme="c" data-inset="false" id="stampUl" style="margin: 0px;">
                    </ul-->
                </div>
                <div class="ui-block-b" id="stampView" style="height: 100%;width: 65%;">
                    <!--預覽顯示圖片區塊-->
					<div style="display:table-cell; vertical-align:middle; text-align:center; width:470px; height:270px">
						<div style="display:inline-block; text-align:right"><br>
							<span id="stampTx"></span><img id="stampImg" style="display:none;"></img><br>
							<div id="signetDiv" style="display:inline-block;">
								<img></img><div style="display:inline-block; overflow:hidden; text-align:center; color:black; background-color:white"></div>
							</div><br>
							<div id="grantApprDiv" style="display:none;">
								<span id="grantApprStampTx"></span><img id="grantApprStampImg" style="display:none;"></img>
							</div>
						</div>
						<div id="proxyWord" style="display:none; text-align:left; font-family:標楷體; font-size:18pt">代</div>
					</div>
                </div>
            </div>
        </div>
        <footer data-role="footer">
			<div style="position:absolute;left:8px;bottom:12px;width:47%;display:inline-block">
				<a id="cancel" data-role="button" data-theme="c">取消</a>
			</div>
			<div style="position:absolute;left:50%;bottom:12px;width:47%;display:inline-block">
				<a id="ok" data-role="button" data-theme="b">確定</a>
			</div>
        </footer>
    </div>
</body>



</html>
