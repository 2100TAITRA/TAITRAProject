<!DOCTYPE html>
<html>
<head>
	<!--meta name="viewport" content="width=640">
	<meta name="scale" content="1.0"-->
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>使用者資訊頁面</title>
</head>
<body>
<section id="userInfoSetting" data-role="dialog">
    <header data-role="header" style="max-width: 98%;">
        <h1 style="margin-top:-8px;margin-bottom:0px">使用者資訊設定</h1>
    </header>
	<div data-role="content" class="ui-grid-a" style="height:380px;width:97%">
		<div class="ui-block">
			<fieldset class="ui-field-contain">
				<label for="inpUserId">帳　　號：</label>
				<input id="inpUserId" value="2100" readonly>
			</fieldset>
			<fieldset class="ui-field-contain">
				<label for="inpUserNm">姓　　名：</label>
				<input id="inpUserNm">
			</fieldset>
			<fieldset class="ui-field-contain">
				<label for="inpTitle">職　　稱：</label>
				<input id="inpTitle">
			</fieldset>
			<fieldset class="ui-field-contain">
				<label for="inpEMail">電子位箱：</label>
				<input id="inpEMail">
			</fieldset>
			<fieldset class="ui-field-contain">
				<label for="inpTel">電　　話：</label>
				<input id="inpTel">
			</fieldset>
			<fieldset class="ui-field-contain">
				<label for="inpTelExt">分　　機：</label>
				<input id="inpTelExt">
			</fieldset>
			<fieldset class="ui-field-contain">
				<label for="inpFax">傳　　真：</label>
				<input id="inpFax">
			</fieldset>
		</div>
		<div class="hide">
			<fieldset class="ui-field-contain">
				<label for="inpOrgNm">機關全銜：</label>
				<input id="inpOrgNm">
			</fieldset>
			<fieldset class="ui-field-contain">
				<label for="inpOrgNo">機關代碼：</label>
				<input id="inpOrgNo">
			</fieldset>
			<fieldset class="ui-field-contain">
				<label for="inpAddr">機關地址：</label>
				<input id="inpAddr">
			</fieldset>
			<fieldset class="ui-field-contain">
				<label for="inpOrgNickName">機關暱稱：</label>
				<input id="inpOrgNickName">
			</fieldset>
			<fieldset class="ui-field-contain">
				<label for="inpDeptNm">單位名稱：</label>
				<input id="inpDeptNm">
			</fieldset>
			<fieldset class="ui-field-contain">
				<label for="inpDeptNo">單位代碼：</label>
				<input id="inpDeptNo">
			</fieldset>
			<fieldset class="ui-field-contain">
				<label for="inpRoleId">角色代碼：</label>
				<input id="inpRoldId">
			</fieldset>
		</div>
	</div>
	<footer data-role="footer" style="background:transparent; border:0px">
		<div style="width:47%;display:inline-block">
			<button id="cancel" data-role="button" data-theme="c" style="width:100%">取消</button>
		</div>
		<div style="width:47%;display:inline-block">
			<button id="ok" data-role="button" data-theme="b" style="width:100%">儲存</button>
		</div>
    </footer>
</section>
</body>
</html>
