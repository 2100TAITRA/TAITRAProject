<!DOCTYPE html>
<html>
<head>
	<!--meta name="viewport" content="width=640">
	<meta name="scale" content="1.0"-->
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>筆跡設定頁面</title>
</head>
<body>
<section id="penSettingDlg" data-role="dialog">
    <header data-role="header">
        <h1>筆跡設定</h1>
    </header>
	<div class="ui-grid-a" id="penSetting" data-role="content" data-theme="c">
		<div class="ui-block-a" style="width:30%; height:330px; background-color:lightgray;">
			<ul data-role="listview" data-inset="false" data-theme="c" style="margin:0px">
				<li>
					<a id="redPenSetting">紅筆</a>
				</li>
				<li>
					<a id="hilitPenSetting">螢光筆</a>
				</li>
			</ul>
		</div>
		<div class="ui-block-b" style="width:70%; height:330px; border-left: 2px solid black; background-color:lightgray;">
			<div data-role="fieldcontain" style="margin:15px 15px 0px 15px">
				<legend style="color:black">顏色：</legend>
				<!--1070607 Raymond 1060862 IE不支援radio button的CSS customize須改用label做 -->
				<div>
					<input type="radio" name="penColor" id="clr1" class="color" value="255,0,0" style="background-color:red;" data-role="none"/>
					<label class="color" for="clr1" style="background-color:red;"></label>
					<input type="radio" name="penColor" id="clr2" class="color" value="0,255,0" style="background-color:lime;" data-role="none"/>
					<label class="color" for="clr2" style="background-color:lime;"></label>
					<input type="radio" name="penColor" id="clr3" class="color" value="0,0,255" style="background-color:blue;" data-role="none"/>
					<label class="color" for="clr3" style="background-color:blue;"></label>
					<input type="radio" name="penColor" id="clr4" class="color" value="255,255,0" style="background-color:yellow;" data-role="none"/>
					<label class="color" for="clr4" style="background-color:yellow;"></label>
					<input type="radio" name="penColor" id="clr5" class="color" value="0,255,255" style="background-color:aqua;" data-role="none"/>
					<label class="color" for="clr5" style="background-color:aqua;"></label>
					<input type="radio" name="penColor" id="clr6" class="color" value="255,0,255" style="background-color:fuchsia;" data-role="none"/>
					<label class="color" for="clr6" style="background-color:fuchsia;"></label>
				</div>
				<div>
					<input type="radio" name="penColor" id="clr7" class="color" value="128,0,0" style="background-color:maroon;" data-role="none"/>
					<label class="color" for="clr7" style="background-color:maroon;"></label>
					<input type="radio" name="penColor" id="clr8" class="color" value="0,128,0" style="background-color:green;" data-role="none"/>
					<label class="color" for="clr8" style="background-color:green;"></label>
					<input type="radio" name="penColor" id="clr9" class="color" value="0,0,128" style="background-color:navy;" data-role="none"/>
					<label class="color" for="clr9" style="background-color:navy;"></label>
					<input type="radio" name="penColor" id="clr10" class="color" value="128,0,128" style="background-color:purple;" data-role="none"/>
					<label class="color" for="clr10" style="background-color:purple;"></label>
					<input type="radio" name="penColor" id="clr11" class="color" value="192,192,192" style="background-color:silver;" data-role="none"/>
					<label class="color" for="clr11" style="background-color:silver;"></label>
					<input type="radio" name="penColor" id="clr12" class="color" value="128,128,128" style="background-color:gray;" data-role="none"/>
					<label class="color" for="clr12" style="background-color:gray;"></label>
				</div>
			</div>
			<fieldset style="display:inline-block; width:45%; margin:15px 0px 5px 15px">
				<legend style="color:black">寬度：</legend>
				<input type="radio" name="penWidth" id="wid1" class="line-width" value="1" style="background-image:url(IMAGE/AOL/line1.png)" data-role="none"/>
				<label class="line-width" for="wid1" style="background-image:url(IMAGE/AOL/line1.png)"></label>
				<input type="radio" name="penWidth" id="wid2" class="line-width" value="2" style="background-image:url(IMAGE/AOL/line2.png)" data-role="none"/>
				<label class="line-width" for="wid2" style="background-image:url(IMAGE/AOL/line2.png)"></label>
				<input type="radio" name="penWidth" id="wid3" class="line-width" value="5" style="background-image:url(IMAGE/AOL/line5.png)" data-role="none"/>
				<label class="line-width" for="wid3" style="background-image:url(IMAGE/AOL/line5.png)"></label>
				<input type="radio" name="penWidth" id="wid4" class="line-width" value="12" style="background-image:url(IMAGE/AOL/line10.png)" data-role="none"/>
				<label class="line-width" for="wid4" style="background-image:url(IMAGE/AOL/line10.png)"></label>
				<input type="radio" name="penWidth" id="wid5" class="line-width" value="20" style="background-image:url(IMAGE/AOL/line20.png)" data-role="none"/>
				<label class="line-width" for="wid5" style="background-image:url(IMAGE/AOL/line20.png)"></label>
			</fieldset>
			<fieldset style="display:inline-block; width:45%; margin:15px 15px 5px 0px">
				<legend style="color:black">不透明度：</legend>
				<input type="radio" name="penTransparency" id="trans1" class="transparancy" value="0.3" style="background-image:url(IMAGE/AOL/transp25.png)" data-role="none"/>
				<label class="transparancy" for="trans1" style="background-image:url(IMAGE/AOL/transp25.png)"></label>
				<input type="radio" name="penTransparency" id="trans2" class="transparancy" value="0.5" style="background-image:url(IMAGE/AOL/transp50.png)" data-role="none"/>
				<label class="transparancy" for="trans2" style="background-image:url(IMAGE/AOL/transp50.png)"></label>
				<input type="radio" name="penTransparency" id="trans3" class="transparancy" value="0.7" style="background-image:url(IMAGE/AOL/transp75.png)" data-role="none"/>
				<label class="transparancy" for="trans3" style="background-image:url(IMAGE/AOL/transp75.png)"></label>
			</fieldset>
		</div>
	</div>
	<footer data-role="footer">
		<div style="width:49.5%;display:inline-block">
			<a id="cancel" data-role="button" data-theme="c" data-corners="false">取消</a>
		</div>
		<div style="width:49.5%;display:inline-block">
			<a id="ok" data-role="button" data-theme="b" data-corners="false">確定</a>
		</div>
    </footer>
</section>
</body>
</html>
