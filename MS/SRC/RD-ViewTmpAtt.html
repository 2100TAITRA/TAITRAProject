<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>簽閱附件</title>
</head>
<body>
	<div id="dlgViewTmp" data-role="page" data-transition="slidedown">
		<header>
			<h2 style="margin-top:-8px;margin-bottom:10px;">簽閱附件</h2>
		</header>
		<div data-role="content" data-theme="b"  style="background-color:lightgray; height:400px; width:98%;">
			<a id="add" data-role="button"  data-theme="b" data-inline="true">新增</a>
			<a id="edit" data-role="button" data-theme="b" data-inline="true">置換</a>
			<a id="del" data-role="button"  data-theme="b" data-inline="true">刪除</a>
			<a id="dl" data-role="button" data-theme="b" data-inline="true" style="float:right;">下載</a>
			<a id="history" data-role="button" data-theme="b" data-inline="true" style="float:right;">異動紀錄</a>
			<div style="width:100%; clear:both;">
				<div id="tmpAttTable">
					<div class="ui-table-header">
						<div class="ui-table-column-header" style="width:30px">序</div>
						<div class="ui-table-column-header" style="width:360px">名稱</div>
						<div class="ui-table-column-header" style="width:160px">人員</div>
						<div class="ui-table-column-header" style="width:116px">加入時間</div>
					</div>
					<div class="ui-table-body-container" style="height:300px; overflow-y:auto">
						<ol data-role="listview" class="ui-table-body" id="tmpAttList" style="margin:0px;"></ol>
					</div>
				</div>
				<input id="addNew" type="file" multiple style="display:none;" data-role="none">
				<input id="repAtt" type="file" multiple style="display:none" data-role="none">
			</div>
		</div>
		<div data-role="navbar" style="max-width:98%">
			<ul>
				<li><button href="" id="btnN" data-icon="delete" data-iconpos="top" data-theme="c" data-transition="slide" data-corners="false">取消</button></li>
				<li><button href="" id="btnY" data-icon="check" data-iconpos="top" data-theme="b" data-transition="slide" data-corners="false">儲存</button></li>
			</ul>
		</div>
		
		<div id="dlgViewHistory" class="ui-slide-pane-right" style="display:none;position:absolute;top:10px;z-index:10;width:700px;height:480px;">
			<div style="background-color: black;width: calc(100% + 10px);height: calc(100% + 10px);position: absolute;top: 0px;left: 0px;z-index: -1;opacity: 0.8;"></div>
			<div data-role="content" data-theme="b"  style="height:calc(100% + 10px); width:calc(100% + 10px);">
				<a id="btClose" data-role="button"  data-theme="b" data-inline="true">關閉</a>
				<div style="width:100%; clear:both;">
					<div id="tmpAttTable">
						<div class="ui-table-header">
							<div class="ui-table-column-header" style="width:30px">序</div>
							<div class="ui-table-column-header" style="width:360px">名稱</div>
							<div class="ui-table-column-header" style="width:160px">新增人員<br>刪除人員</div>
							<div class="ui-table-column-header" style="width:116px">加入時間<br>刪除時間</div>
						</div>
						<div class="ui-table-body-container" style="height:365px; overflow-y:auto">
							<ol data-role="listview" class="ui-table-body" id="tmpAttHistory" style="margin:0px;"></ol>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- 1111221	Leslie[1111238]	新增檔案拖拉加入附件功能 -->
		<div class="FileDrop">
			<h1>將檔案拖放到這裡</h1>
		</div>
	</div>
</body>
</html>
