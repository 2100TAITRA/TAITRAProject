<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>優先度設定</title>
</head>
<body>
	<div id="dlgPrioritySetting" data-role="dialog" data-transition="slidedown">
		<header data-theme="d">
			<h1 style="margin-top:0px">優先等級變更</h1>
		</header>
		<div data-role="content" data-theme="c" style="width: 95%;">
			<label for="priority" id="lbDocNo">優先等級：</label>
			<select id="priority" data-mini="true" data-theme="c">
				<option value="0" selected>無</option>
				<option value="1">★</option>
				<option value="2">★★</option>
			</select>
			<footer class="ui-grid-a">
				<div class="ui-block-a"><a id="cancel" data-role="button" data-corners="false" data-theme="c">取消</a></div>
				<div class="ui-block-b"><a id="ok" data-role="button" data-corners="false" data-theme="b">確定</a></div>       
			</footer>
		</div>
	</div>
</body>
</html>
