<!DOCTYPE html>

<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
	<title>參考公文設定子視窗</title>
</head>

<body>

	<div data-role="page" id="refDocMgmt">
		<header data-role="header" data-theme="b">
			<h1>參考公文管理</h1>
			<label>
				<span class="inlineB" style="text-align-last: justify;width:130px;">參考公文文號：</span>
				<input class ="DVD" id="refDocTxt" data-inline="true" maxlength="10">
				<a data-role="button" id="btRefDocAdd" class="inlineB" style="margin: 0 0 0 5px">加入</a>
			</label>
		</header>
		<div data-role="content" id="refDocMgmtContent" style="background-color:lightgray; overflow-y:scroll; overflow-x:hidden;">
			<div class="ui-table-header">
				<div class="ui-table-column-header" style="width:30px">序</div>
				<div class="ui-table-column-header" style="width:100px">文號</div>
				<div class="ui-table-column-header" style="width:395px">主旨</div>
				<div class="ui-table-column-header" style="width:180px">備註</div>
				<div class="ui-table-column-header" style="width:100px">加入時間</div>
			</div>
			<ol data-role="listview" data-theme="c" data-inset="false" id="divUl" style="margin:0px;">
				<!--參考公文清單區塊-->
			</ol>
		</div>
		<div data-role="navbar">
			<ul>
				<li><button href="" id="btnN" data-icon="delete" data-iconpos="top" data-theme="c" data-transition="slide" data-corners="false">取消</button></li>
				<li><button href="" id="btnY" data-icon="check" data-iconpos="top" data-theme="b" data-transition="slide" data-corners="false">儲存</button></li>
			</ul>
		</div>
	</div>
</body>
</html>
