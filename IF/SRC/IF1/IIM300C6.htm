function fnOnLoad()
{
	//1100504	Joe		1100473		弱掃修正Client DOM XSS
	//embeddedFrame.location = "IIM300C6.aspx" + GetAllParamStr();
	embeddedFrame.location = "IIM300C6.aspx" + encodeURI(GetAllParamStr());
}
function GetAllParamStr()
{
	var strParam = "";
	<!--1080816		Joe		1080628		取消htm解碼行為-->
	<!-- var pUrl = unescape(this.location); -->
	var pUrl = this.location.href;
	if( pUrl != -1 )
	{
		var i = pUrl.indexOf("?");
		if(i != -1)
			strParam = pUrl.substr(i); 
	}
	return strParam;
}
