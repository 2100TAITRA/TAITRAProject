function fnOnLoad()

	//embeddedFrame.location = "IFC021.aspx" + GetAllParamStr();
	embeddedFrame.location = "IFC021.aspx" + encodeURI(GetAllParamStr());
}
function GetAllParamStr()
{
	var strParam = "";
	var pUrl = unescape(this.location);
	if( pUrl != -1 )
	{
		var i = pUrl.indexOf("?");
		if(i != -1)
			strParam = pUrl.substr(i); 
	}
	return strParam;
}
</script>
