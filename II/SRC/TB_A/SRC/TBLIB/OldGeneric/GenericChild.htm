	.TRVisible {display: block;width: 80; height:25;font-size: 10pt;text-align: center;}

	</style>
<script>
//#######底下為單隻測試時所需要的code#############################################################

//######################################################################################
// When the body loads, setup intial settings.
function jf_MenuInit()
{
	oMenuContainer.innerHTML='<span class="SetlabelCss" id="oMenu" onmouseOver="fnMouseEnter()">設　定</span>';
	oMenuContainer.innerHTML+='<span id="Contain1" class="TableContainerCss">';
	oMenuContainer.innerHTML+='</span>';
	oMenuContainer.innerHTML+='<span class="LeavelabelCss" onclick="jf_ConfirmExit();">離　開</span>';
	document.all.tbTool.style.zIndex=1;
}

//Show two modes for User to choose
function fnMouseEnter()
{
	var oContain1=eval("Contain1");
	oContain1.style.top=25;
	oContain1.style.display="block";
	oContain1.style.left=document.all.tbTool.offsetWidth-180;
	//單隻測試用document.body.offsetWidth
	oContain1.innerHTML=
	'<TABLE id="tbMode" class="TableCss" onmouseleave="TableClose()" cellpadding="0" cellspacing="0">'+
		'<TR class="TRCss">'+
			'<TD class="TRCss" id="oMode1" onmouseEnter="ShowModeItem()">預覽格式設定</TD>'+
			'<TD id="oColor1"><IMG style="display:none" id="oImg1" src="../../../STD/IMAGE/flyout_red.gif"></TD>'+
			'<TD id="oColor3""><IMG style="display:none" id="oImg3" src="../../../STD/IMAGEflyout_red.gif"></TD>'+
			'<TD class="TRHidden" id="oItem1" onclick="fnFormat()" onmouseOver="fnFocusColor()" onmouseOut="fnFocusOut()">PDF預覽</TD>'+
			'<TD class="TRHidden" id="oItem3" onclick="fnClean()" onmouseOver="fnFocusColor()" onmouseOut="fnFocusOut()">保留模式</TD>'+
		'</TR>'+
		'<TR class="TRCss">'+
			'<TD class="TRCss" id="oMode2" onmouseEnter="ShowModeItem()">資料清除設定</TD>'+
			'<TD id="oColor2"><IMG style="display:none" id="oImg2" src="../../../STD/IMAGE/flyout_red.gif"></TD>'+
			'<TD id="oColor4"><IMG style="display:none" id="oImg4" src="../../../STD/IMAGE/flyout_red.gif"></TD>'+
			'<TD class="TRHidden" id="oItem2" onclick="fnFormat()" onmouseOver="fnFocusColor()" onmouseOut="fnFocusOut()">WORD預覽</TD>'+
			'<TD class="TRHidden" id="oItem4" onclick="fnClean()" onmouseOver="fnFocusColor()" onmouseOut="fnFocusOut()">清除模式</TD>'+
		'</TR>'+
	'</TABLE>';
}

function TableClose()
{
	eval("tbMode").style.display="none";
}

//Show detail items of 2 modes
function ShowModeItem()
{
	oWorkItem=event.srcElement;
	if (oWorkItem.innerHTML=="預覽格式設定")
	{
		eval("oMode1").style.backgroundColor = "LightGrey";
		eval("oMode2").style.backgroundColor = "black";
		eval("oItem1").className="TRVisible";	//PDF type
		eval("oItem2").className="TRVisible";	//WORD type
		eval("oItem3").className="TRHidden";	//keep mode
		eval("oItem4").className="TRHidden";	//Clean mode
		if(jf_ReadCookie("FORMAT") == "PDF")
		{
			document.all["oImg1"].style.display = "block";
			document.all["oImg2"].style.display = "none";
			document.all["oImg3"].style.display = "none";
			document.all["oImg4"].style.display = "none";
		}
		else
		{
			document.all["oImg1"].style.display = "none";
			document.all["oImg2"].style.display = "block";
			document.all["oImg3"].style.display = "none";
			document.all["oImg4"].style.display = "none";
		}
	}
	else if (oWorkItem.innerHTML=="資料清除設定")
	{
		eval("oMode1").style.backgroundColor = "black";
		eval("oMode2").style.backgroundColor = "LightGrey";
		eval("oItem1").className="TRHidden";
		eval("oItem2").className="TRHidden";
		eval("oItem3").className="TRVisible";
		eval("oItem4").className="TRVisible";
		if(jf_ReadCookie("Mode") == "Keep" )
		{
			document.all["oImg1"].style.display = "none";
			document.all["oImg2"].style.display = "none";
			document.all["oImg3"].style.display = "block";
			document.all["oImg4"].style.display = "none";
		}
		else
		{
			document.all["oImg1"].style.display = "none";
			document.all["oImg2"].style.display = "none";
			document.all["oImg3"].style.display = "none";
			document.all["oImg4"].style.display = "block";
		}
	}
}

function fnFocusColor()
{
	if (event.srcElement.id=="oItem1")
	{
		eval("oItem1").style.backgroundColor = "LightGrey";
		eval("oColor1").style.backgroundColor = "LightGrey";
	}
	else if (event.srcElement.id=="oItem2")
	{
		eval("oItem2").style.backgroundColor = "LightGrey";
		eval("oColor2").style.backgroundColor = "LightGrey";
	}
	else if (event.srcElement.id=="oItem3")
	{
		eval("oItem3").style.backgroundColor = "LightGrey";
		eval("oColor3").style.backgroundColor = "LightGrey";
	}
	else if (event.srcElement.id=="oItem4")
	{
		eval("oItem4").style.backgroundColor = "LightGrey";
		eval("oColor4").style.backgroundColor = "LightGrey";
	}
}

function fnFocusOut()
{
	eval("oItem1").style.backgroundColor = "black";
	eval("oItem2").style.backgroundColor = "black";
	eval("oItem3").style.backgroundColor = "black";
	eval("oItem4").style.backgroundColor = "black";
	eval("oColor1").style.backgroundColor = "black";
	eval("oColor2").style.backgroundColor = "black";
	eval("oColor3").style.backgroundColor = "black";
	eval("oColor4").style.backgroundColor = "black";
}

//set Cookie "FORMAT" property
function fnFormat()
{
	oWorkItem=event.srcElement;
	if (oWorkItem.id=="oItem1")
		jf_SaveCookieWithExpire('FORMAT', 'PDF');
	else if (oWorkItem.id=="oItem2")
		jf_SaveCookieWithExpire('FORMAT', 'WORD');
	TableClose();
	//alert("已設定報表為 " + jf_ReadCookie("FORMAT") + " 模式");
}

//Set Cookie "Mode" property
function fnClean()
{
	oWorkItem=event.srcElement;
	if (oWorkItem.id=="oItem3")
		jf_SaveCookieWithExpire('Mode', 'Keep');
	else if (oWorkItem.id=="oItem4")
		jf_SaveCookieWithExpire('Mode', 'Clean');
	TableClose();
	//alert("已設定系統為 " + jf_ReadCookie("Mode") + " 模式");
}
</script>
